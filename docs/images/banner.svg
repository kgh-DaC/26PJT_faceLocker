<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="facedoor: 얼굴인식 사물함 도어 제어 시스템">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2742"/>
      <stop offset="1" stop-color="#16406b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7cc4ff"/>
    </marker>
    <style>
      text { font-family: "Pretendard", "Noto Sans KR", "NanumGothic", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
      .title { font-size: 64px; font-weight: 800; fill: #ffffff; letter-spacing: 1px; }
      .sub { font-size: 26px; font-weight: 700; fill: #dbeafe; }
      .chip { font-size: 15px; font-weight: 600; fill: #0f2742; }
      .cap { font-size: 14px; font-weight: 600; fill: #bfdbfe; }
    </style>
  </defs>

  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>

  <!-- 왼쪽: 제목 -->
  <text x="60" y="140" class="title">facedoor</text>
  <text x="62" y="186" class="sub">얼굴인식 사물함·도어(솔밸브) 제어 시스템</text>

  <g transform="translate(60,222)">
    <rect width="150" height="32" rx="16" fill="#7cc4ff"/>
    <text x="75" y="21" text-anchor="middle" class="chip">Raspberry Pi 5</text>
    <rect x="160" width="140" height="32" rx="16" fill="#7cc4ff"/>
    <text x="230" y="21" text-anchor="middle" class="chip">Ubuntu 24.04</text>
    <rect x="310" width="190" height="32" rx="16" fill="#7cc4ff"/>
    <text x="405" y="21" text-anchor="middle" class="chip">OpenCV YuNet + SFace</text>
  </g>
  <g transform="translate(60,264)">
    <rect width="170" height="32" rx="16" fill="#fde68a"/>
    <text x="85" y="21" text-anchor="middle" class="chip">PC mock 모드 개발</text>
    <rect x="180" width="200" height="32" rx="16" fill="#bbf7d0"/>
    <text x="280" y="21" text-anchor="middle" class="chip">FAR/FRR·ROC 평가 리포트</text>
  </g>

  <!-- 오른쪽: 웹캠 → 얼굴 → 사물함 -->
  <!-- 웹캠 -->
  <g transform="translate(640,120)">
    <rect x="0" y="0" width="96" height="70" rx="14" fill="#e2e8f0"/>
    <circle cx="48" cy="35" r="24" fill="#1e293b"/>
    <circle cx="48" cy="35" r="13" fill="#38bdf8"/>
    <circle cx="43" cy="30" r="4" fill="#e0f2fe"/>
    <rect x="38" y="70" width="20" height="18" fill="#cbd5e1"/>
    <rect x="18" y="88" width="60" height="10" rx="5" fill="#cbd5e1"/>
    <text x="48" y="126" text-anchor="middle" class="cap">USB 웹캠</text>
  </g>

  <line x1="748" y1="155" x2="790" y2="155" stroke="#7cc4ff" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- 얼굴 + 검출 박스 + 랜드마크 -->
  <g transform="translate(800,82)">
    <rect x="0" y="0" width="130" height="150" rx="6" fill="none" stroke="#22c55e" stroke-width="4"/>
    <path d="M0,22 V0 H22 M108,0 H130 V22 M130,128 V150 H108 M22,150 H0 V128" fill="none" stroke="#86efac" stroke-width="6"/>
    <ellipse cx="65" cy="78" rx="42" ry="54" fill="#fcd9b6"/>
    <path d="M23,66 Q26,20 65,20 Q104,20 107,66 Q96,40 65,38 Q34,40 23,66 z" fill="#3f2a1d"/>
    <circle cx="48" cy="74" r="5" fill="#1e293b"/>
    <circle cx="82" cy="74" r="5" fill="#1e293b"/>
    <path d="M52,108 Q65,117 78,108" fill="none" stroke="#9a3412" stroke-width="3" stroke-linecap="round"/>
    <!-- 5점 랜드마크 -->
    <g fill="#22d3ee">
      <circle cx="48" cy="74" r="3"/><circle cx="82" cy="74" r="3"/><circle cx="65" cy="92" r="3"/>
      <circle cx="53" cy="108" r="3"/><circle cx="77" cy="108" r="3"/>
    </g>
    <rect x="0" y="-30" width="130" height="26" rx="4" fill="#22c55e"/>
    <text x="65" y="-12" text-anchor="middle" font-size="14" font-weight="700" fill="#052e16">MATCH 0.71</text>
    <text x="65" y="176" text-anchor="middle" class="cap">검출 → 임베딩 → 비교</text>
  </g>

  <line x1="940" y1="155" x2="966" y2="155" stroke="#7cc4ff" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- 사물함 4칸 (1번 열림) -->
  <g transform="translate(994,62)">
    <rect x="0" y="0" width="160" height="196" rx="8" fill="#94a3b8"/>
    <!-- 1번: 열림 -->
    <rect x="10" y="10" width="66" height="84" rx="4" fill="#0f172a"/>
    <path d="M10,10 L-14,22 L-14,106 L10,94 z" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
    <circle cx="43" cy="52" r="12" fill="#22c55e"/>
    <text x="43" y="57" text-anchor="middle" font-size="14" font-weight="800" fill="#052e16">1</text>
    <!-- 2~4번: 닫힘 -->
    <rect x="84" y="10" width="66" height="84" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <text x="117" y="58" text-anchor="middle" font-size="20" font-weight="800" fill="#475569">2</text>
    <rect x="10" y="102" width="66" height="84" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <text x="43" y="150" text-anchor="middle" font-size="20" font-weight="800" fill="#475569">3</text>
    <rect x="84" y="102" width="66" height="84" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <text x="117" y="150" text-anchor="middle" font-size="20" font-weight="800" fill="#475569">4</text>
    <text x="80" y="226" text-anchor="middle" class="cap">본인 사물함만 열림</text>
  </g>

  <!-- LED 3개 -->
  <g transform="translate(800,292)">
    <circle cx="20" cy="12" r="10" fill="#22c55e"/>
    <circle cx="50" cy="12" r="10" fill="#7f1d1d"/>
    <circle cx="80" cy="12" r="10" fill="#78350f"/>
    <text x="102" y="17" class="cap">확인용 LED (녹·적·황)</text>
  </g>
</svg>
