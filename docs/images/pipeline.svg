<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="인식 흐름: 영상 입력, 얼굴 찾기, 품질 검사, 특징 추출, 사람 비교, 투표 판정, 출력">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: "Pretendard", "Noto Sans KR", "NanumGothic", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
      .h { font-size: 22px; font-weight: 800; fill: #0f172a; }
      .t { font-size: 18px; font-weight: 800; fill: #0f172a; }
      .s { font-size: 14px; font-weight: 700; fill: #1d4ed8; }
      .d { font-size: 13px; fill: #334155; }
      .n { font-size: 14px; font-weight: 800; fill: #ffffff; }
      .ot { font-size: 16px; font-weight: 800; fill: #0f172a; }
      .od { font-size: 13px; fill: #334155; }
      .note { font-size: 13px; fill: #475569; }
    </style>
  </defs>

  <rect width="1200" height="440" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="30" y="44" class="h">한 프레임이 처리되는 순서</text>
  <text x="1170" y="44" text-anchor="end" class="note">평가(evaluate.py)도 이 파이프라인을 그대로 사용</text>

  <!-- 6단계 (x = 30 + i*194, 폭 170) -->
  <g transform="translate(30,70)">
    <rect width="170" height="150" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <circle cx="24" cy="24" r="14" fill="#1d4ed8"/><text x="24" y="29" text-anchor="middle" class="n">1</text>
    <text x="46" y="30" class="t">영상 입력</text>
    <text x="16" y="70" class="s">USB 웹캠</text>
    <text x="16" y="96" class="d">640×480 프레임</text>
    <text x="16" y="118" class="d">PC: 인덱스 0</text>
    <text x="16" y="138" class="d">Pi: /dev/video0</text>
  </g>
  <g transform="translate(224,70)">
    <rect width="170" height="150" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <circle cx="24" cy="24" r="14" fill="#1d4ed8"/><text x="24" y="29" text-anchor="middle" class="n">2</text>
    <text x="46" y="30" class="t">얼굴 찾기</text>
    <text x="16" y="70" class="s">YuNet 검출</text>
    <text x="16" y="96" class="d">얼굴 위치(박스)</text>
    <text x="16" y="118" class="d">눈·코·입 5점</text>
    <text x="16" y="138" class="d">랜드마크</text>
  </g>
  <g transform="translate(418,70)">
    <rect width="170" height="150" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
    <circle cx="24" cy="24" r="14" fill="#b45309"/><text x="24" y="29" text-anchor="middle" class="n">3</text>
    <text x="46" y="30" class="t">품질 검사</text>
    <text x="16" y="70" class="s" fill="#b45309" style="fill:#b45309">크기·흐림·밝기</text>
    <text x="16" y="96" class="d">얼굴 80px 이상</text>
    <text x="16" y="118" class="d">각도·가장자리 확인</text>
    <text x="16" y="138" class="d">미달 → HOLD(황색)</text>
  </g>
  <g transform="translate(612,70)">
    <rect width="170" height="150" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <circle cx="24" cy="24" r="14" fill="#1d4ed8"/><text x="24" y="29" text-anchor="middle" class="n">4</text>
    <text x="46" y="30" class="t">특징 추출</text>
    <text x="16" y="70" class="s">SFace 임베딩</text>
    <text x="16" y="96" class="d">얼굴을 정렬한 뒤</text>
    <text x="16" y="118" class="d">숫자 128개로 변환</text>
    <text x="16" y="138" class="d">(얼굴 "지문")</text>
  </g>
  <g transform="translate(806,70)">
    <rect width="170" height="150" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <circle cx="24" cy="24" r="14" fill="#1d4ed8"/><text x="24" y="29" text-anchor="middle" class="n">5</text>
    <text x="46" y="30" class="t">사람 비교</text>
    <text x="16" y="70" class="s">코사인 유사도</text>
    <text x="16" y="96" class="d">등록 사진들과 비교</text>
    <text x="16" y="118" class="d">점수 ≥ 0.50 이고</text>
    <text x="16" y="138" class="d">2등과 0.05 이상 차이</text>
  </g>
  <g transform="translate(1000,70)">
    <rect width="170" height="150" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
    <circle cx="24" cy="24" r="14" fill="#047857"/><text x="24" y="29" text-anchor="middle" class="n">6</text>
    <text x="46" y="30" class="t">투표 판정</text>
    <text x="16" y="70" class="s" style="fill:#047857">3 / 5 투표</text>
    <text x="16" y="96" class="d">최근 5프레임 중</text>
    <text x="16" y="118" class="d">같은 사람 3회 일치</text>
    <text x="16" y="138" class="d">→ 열기 신호 1회</text>
  </g>

  <!-- 단계 사이 화살표 -->
  <g stroke="#475569" stroke-width="3" marker-end="url(#a)">
    <line x1="202" y1="145" x2="220" y2="145"/>
    <line x1="396" y1="145" x2="414" y2="145"/>
    <line x1="590" y1="145" x2="608" y2="145"/>
    <line x1="784" y1="145" x2="802" y2="145"/>
    <line x1="978" y1="145" x2="996" y2="145"/>
  </g>

  <!-- 판정 → 출력 -->
  <path d="M1085,222 V258" fill="none" stroke="#475569" stroke-width="3"/>
  <line x1="165" y1="258" x2="1085" y2="258" stroke="#475569" stroke-width="3"/>
  <g stroke="#475569" stroke-width="3" marker-end="url(#a)">
    <line x1="165" y1="258" x2="165" y2="286"/>
    <line x1="455" y1="258" x2="455" y2="286"/>
    <line x1="745" y1="258" x2="745" y2="286"/>
    <line x1="1035" y1="258" x2="1035" y2="286"/>
  </g>
  <text x="1095" y="246" class="note">결과</text>

  <!-- 출력 4개 -->
  <g transform="translate(30,292)">
    <rect width="270" height="118" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <rect x="18" y="20" width="34" height="44" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <circle cx="35" cy="42" r="7" fill="#22c55e"/>
    <text x="68" y="38" class="ot">사물함 솔밸브</text>
    <text x="68" y="62" class="od">배정된 사물함 1칸만 ON</text>
    <text x="18" y="92" class="od">문이 닫힌 것을 리밋센서로</text>
    <text x="18" y="110" class="od">확인하면 다시 잠금</text>
  </g>
  <g transform="translate(320,292)">
    <rect width="270" height="118" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="30" cy="42" r="11" fill="#22c55e"/>
    <circle cx="58" cy="42" r="11" fill="#ef4444"/>
    <circle cx="86" cy="42" r="11" fill="#f59e0b"/>
    <text x="110" y="48" class="ot">확인용 LED</text>
    <text x="18" y="84" class="od">녹색: 열기 신호 출력 중</text>
    <text x="18" y="104" class="od">적색: 거부 · 황색: 판정 보류</text>
  </g>
  <g transform="translate(610,292)">
    <rect width="270" height="118" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="18" y="22" width="52" height="36" rx="4" fill="#1e293b"/>
    <rect x="26" y="30" width="20" height="20" fill="none" stroke="#22c55e" stroke-width="2"/>
    <rect x="52" y="30" width="12" height="20" fill="#334155"/>
    <text x="84" y="48" class="ot">인식 화면</text>
    <text x="18" y="84" class="od">얼굴 박스·이름·점수 표시</text>
    <text x="18" y="104" class="od">사물함 열림/닫힘 패널</text>
  </g>
  <g transform="translate(900,292)">
    <rect width="270" height="118" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M20,18 h30 l12,12 v34 h-42 z" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <line x1="28" y1="40" x2="54" y2="40" stroke="#64748b" stroke-width="2"/>
    <line x1="28" y1="50" x2="54" y2="50" stroke="#64748b" stroke-width="2"/>
    <text x="78" y="48" class="ot">기록 남기기</text>
    <text x="18" y="84" class="od">logs/events.csv (프레임별)</text>
    <text x="18" y="104" class="od">나중에 정답을 붙여 재평가</text>
  </g>
</svg>
