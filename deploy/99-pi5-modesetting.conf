# Raspberry Pi 5 + Ubuntu: X 서버가 표시 장치(card1 = vc4-drm, HDMI)를 찾지 못해
# "no primary bus or device found / Cannot run in framebuffer mode" 로 종료되는 문제를 막는다.
# card0 = v3d(3D 연산 전용, 출력 없음), card1 = vc4-drm(HDMI 출력).
# 설치:  sudo mkdir -p /etc/X11/xorg.conf.d && sudo cp 99-pi5-modesetting.conf /etc/X11/xorg.conf.d/
# 제거:  sudo rm /etc/X11/xorg.conf.d/99-pi5-modesetting.conf
Section "OutputClass"
    Identifier "vc4"
    MatchDriver "vc4"
    Driver "modesetting"
    Option "PrimaryGPU" "true"
EndSection

Section "Device"
    Identifier "Pi5 display"
    Driver "modesetting"
    Option "kmsdev" "/dev/dri/card1"
EndSection
